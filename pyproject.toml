[build-system]
requires = ["setuptools==75.6.0"]
build-backend = "setuptools.build_meta"

[project]
name = "offline-dataflow-policy-auditor"
version = "1.0.0"
requires-python = ">=3.12,<3.13"
dependencies = []

[project.scripts]
pipeline-auditor = "pipeline_auditor.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100

[tool.mypy]
python_version = "3.12"
strict = true

[tool.pytest.ini_options]
pythonpath = ["src"]
